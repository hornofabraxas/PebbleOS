# Weekly sweep for dead external links in the documentation. Scheduled
# rather than PR-gating so transient outages of third-party sites do not
# block unrelated PRs.
name: Docs Link Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "docs/requirements.txt"

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Check links
        # The wasm playground only builds for HTML; it has no links to check.
        # Doxygen pages (apidoc/) exist only in the Read the Docs build,
        # localhost links are instructions, and these vendor sites refuse
        # (403) or stall bots. Extend conf.py's ignore list in this checkout
        # only, keeping upstream's entries.
        run: |
          cat >> docs/conf.py <<'EOF'
          linkcheck_ignore += [
              r"(\.\./)*apidoc/",
              r"https?://localhost[:/]",
              r"https://www\.nordicsemi\.com/",
              r"https://www\.renesas\.com/",
              r"https://www\.st\.com/",
          ]
          EOF
          sphinx-build -b linkcheck -D pbl_playground=0 docs _linkcheck
